name: 'Dependency update'

on:
  workflow_call:
    inputs:
      mode:
        description: >-
          `nightly` updates the production dependencies within their constraints, to merge automatically.
          `review` gathers what needs a human review.
        required: true
        type: string
      php-version:
        description: 'PHP version to run on.'
        required: false
        type: string
        default: '8.4'
      php-extensions:
        description: 'Comma-separated list of PHP extensions to install.'
        required: false
        type: string
        default: ''
      branch:
        description: 'Branch of the pull request. Defaults to chore/nightly-dependencies or chore/dependencies-review.'
        required: false
        type: string
        default: ''
      base-branch:
        description: 'Branch the pull request targets.'
        required: false
        type: string
        default: 'main'
      ci-workflow:
        description: 'Workflow file dispatched on the branch to run the CI.'
        required: false
        type: string
        default: 'ci.yml'
      working-directory:
        description: 'Directory holding composer.json.'
        required: false
        type: string
        default: '.'
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    name: 'Dependency update (${{ inputs.mode }})'
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base-branch }}

      - name: 'Setup PHP and install dependencies'
        uses: IQ2i/.github/actions/setup-php@main
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          dependency-versions: locked
          working-directory: ${{ inputs.working-directory }}

      - name: 'Update the dependencies'
        uses: IQ2i/.github/actions/dependency-update@main
        with:
          mode: ${{ inputs.mode }}
          branch: ${{ inputs.branch }}
          base-branch: ${{ inputs.base-branch }}
          ci-workflow: ${{ inputs.ci-workflow }}
          working-directory: ${{ inputs.working-directory }}
          github-token: ${{ github.token }}
