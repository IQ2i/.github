name: 'Dependency update'

on:
  workflow_call:
    secrets:
      app-client-id:
        description: 'Client ID of the GitHub App that opens the pull request.'
        required: true
      app-private-key:
        description: 'Private key of the GitHub App.'
        required: true
    inputs:
      mode:
        description: >-
          `nightly` updates the production dependencies within their constraints and patches the vulnerable
          ones, dev included, to merge automatically. `review` gathers what needs a human review.
        required: true
        type: string
      php-version:
        description: 'PHP version to run on.'
        required: false
        type: string
        default: '8.4'
      php-extensions:
        description: 'Comma-separated list of PHP extensions to install.'
        required: false
        type: string
        default: ''
      branch:
        description: 'Branch of the pull request. Defaults to chore/nightly-dependencies or chore/dependencies-review.'
        required: false
        type: string
        default: ''
      base-branch:
        description: 'Branch the pull request targets.'
        required: false
        type: string
        default: 'main'
      assignees:
        description: 'Comma-separated logins assigned to the pull request, who get notified about it.'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Directory holding composer.json.'
        required: false
        type: string
        default: '.'
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'

# The pull request is opened with the GitHub App token, not with this one.
permissions:
  contents: read

jobs:
  update:
    name: 'Dependency update (${{ inputs.mode }})'
    runs-on: ${{ inputs.runs-on }}

    steps:
      # A push made with the GITHUB_TOKEN triggers no workflow and leaves the pull_request runs waiting for an
      # approval: the branch has to be pushed by a GitHub App for the CI to run on it.
      - name: 'Generate a GitHub App token'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base-branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: 'Setup PHP and install dependencies'
        uses: IQ2i/.github/actions/setup-php@main
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          dependency-versions: locked
          working-directory: ${{ inputs.working-directory }}

      - name: 'Update the dependencies'
        uses: IQ2i/.github/actions/dependency-update@main
        with:
          mode: ${{ inputs.mode }}
          branch: ${{ inputs.branch }}
          base-branch: ${{ inputs.base-branch }}
          assignees: ${{ inputs.assignees }}
          working-directory: ${{ inputs.working-directory }}
          github-token: ${{ steps.app-token.outputs.token }}
