name: 'Symfony application'

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to run on.'
        required: false
        type: string
        default: '8.4'
      php-extensions:
        description: 'Comma-separated list of PHP extensions to install.'
        required: false
        type: string
        default: ''
      dependency-versions:
        description: 'Which dependencies to install: highest, lowest or locked.'
        required: false
        type: string
        default: 'locked'
      composer-options:
        description: 'Extra options appended to the Composer command.'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Directory holding composer.json.'
        required: false
        type: string
        default: '.'
      runs-on:
        required: false
        type: string
        default: 'ubuntu-latest'
      ref:
        description: 'Git ref to check out. Defaults to the ref that triggered the workflow.'
        required: false
        type: string
        default: ''
      before-script:
        description: 'Shell script run after dependencies are installed, e.g. a frontend build.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  symfony-app:
    name: 'Symfony checks (PHP ${{ inputs.php-version }})'
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: 'Setup PHP and install dependencies'
        uses: IQ2i/.github/actions/setup-php@main
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          dependency-versions: ${{ inputs.dependency-versions }}
          composer-options: ${{ inputs.composer-options }}
          working-directory: ${{ inputs.working-directory }}

      - name: 'Run before-script'
        if: inputs.before-script != ''
        env:
          BEFORE_SCRIPT: ${{ inputs.before-script }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$BEFORE_SCRIPT"

      # A dependency update can break the wiring without breaking a single test.
      - name: 'Lint container'
        run: |
          set -euo pipefail
          php bin/console lint:container --no-interaction

      - name: 'Lint Twig templates'
        run: |
          set -euo pipefail
          if [ -d templates ]; then
            php bin/console lint:twig templates --no-interaction
          fi

      - name: 'Lint YAML configuration'
        run: |
          set -euo pipefail
          if [ -d config ]; then
            php bin/console lint:yaml config --parse-tags --no-interaction
          fi

      - name: 'Twig-CS-Fixer'
        run: |
          set -euo pipefail
          if [ -x vendor/bin/twig-cs-fixer ]; then
            vendor/bin/twig-cs-fixer lint --no-interaction
          else
            echo "::notice::twig-cs-fixer is not installed, skipping."
          fi

      # The fixer exits 0 even when it rewrites files, so the diff is what fails the job.
      - name: 'Tailwind-CS-Fixer'
        run: |
          set -euo pipefail
          if [ -x vendor/bin/tailwind-cs-fixer ] && [ -d templates ]; then
            vendor/bin/tailwind-cs-fixer templates/
            git diff --exit-code -- templates/
          else
            echo "::notice::tailwind-cs-fixer is not installed, skipping."
          fi

      - name: 'Compile and audit the importmap'
        run: |
          set -euo pipefail
          if [ -f importmap.php ]; then
            php bin/console asset-map:compile --no-interaction
            php bin/console importmap:audit --no-interaction
          else
            echo "::notice::No importmap.php found, skipping."
          fi
